<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<!-- ============================================================
  Scanly · QR 掃描器（PWA）
  單一檔案主程式：HTML + CSS + JavaScript 全部內建。
  依賴：同層的 jsQR.js（離線備援解碼器）、manifest.json、sw.js 與圖示。
  功能：相機即時掃描、相簿圖片解碼、結果智慧解析、歷史紀錄、
        深淺色主題、離線可用、可安裝、新版本更新提示。
============================================================ -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scanly · QR 掃描器</title>
<meta name="description" content="快速、安全、可離線使用的 QR Code 與條碼掃描器。">

<!-- PWA / iOS / Android 設定 -->
<meta name="theme-color" content="#0A0C10">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scanly">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>
/* ============================================================
   1. 設計代幣（Design Tokens）：預設深色，支援淺色與手動切換
============================================================ */
:root{
  --bg:#0A0C10; --surface:#14171E; --surface-2:#1B1F28; --surface-3:#242936;
  --text:#F2F4F8; --muted:#8B93A3; --line:rgba(255,255,255,.08);
  --accent:#4C8DFF; --accent-ink:#fff; --accent-soft:rgba(76,141,255,.16);
  --warn:#F5B544; --warn-soft:rgba(245,181,68,.14);
  --danger:#FF6B6B; --ok:#34D399;
  --glass:rgba(24,27,35,.72); --shadow:0 12px 40px rgba(0,0,0,.45);
  --radius:20px; --tab-h:64px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang TC",monospace;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#F0F2F7; --surface-3:#E5E8F0;
    --text:#0E1116; --muted:#667085; --line:rgba(15,20,30,.09);
    --accent:#2F6BFF; --accent-soft:rgba(47,107,255,.12);
    --warn:#B7791F; --warn-soft:rgba(245,181,68,.18); --danger:#D92D20; --ok:#0E9F6E;
    --glass:rgba(255,255,255,.78); --shadow:0 12px 40px rgba(20,30,60,.16);
  }
}
:root[data-theme="light"]{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#F0F2F7; --surface-3:#E5E8F0;
  --text:#0E1116; --muted:#667085; --line:rgba(15,20,30,.09);
  --accent:#2F6BFF; --accent-soft:rgba(47,107,255,.12);
  --warn:#B7791F; --warn-soft:rgba(245,181,68,.18); --danger:#D92D20; --ok:#0E9F6E;
  --glass:rgba(255,255,255,.78); --shadow:0 12px 40px rgba(20,30,60,.16);
}

/* ============================================================
   2. 基礎重設
============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  -webkit-text-size-adjust:100%;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body{position:fixed;inset:0;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* Lucide 風格圖示：統一 1.8px 線寬、圓角端點、無填色 */
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:18px;height:18px}.ic.lg{width:28px;height:28px}.ic.xl{width:40px;height:40px}

/* ============================================================
   3. App 外框與分頁
============================================================ */
#app{position:absolute;inset:0;display:flex;flex-direction:column}
.view{position:absolute;inset:0;display:none;overflow:hidden}
.view.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--safe-t) + 18px) 16px calc(var(--tab-h) + var(--safe-b) + 40px)}
.page{max-width:680px;margin:0 auto}
.page-title{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:6px 4px 14px;display:flex;align-items:center;justify-content:space-between}

/* 底部浮動分頁列（毛玻璃） */
#tabbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 12px);z-index:30;
  width:min(420px,calc(100% - 28px));height:var(--tab-h);display:flex;gap:4px;padding:6px;
  background:var(--glass);border:1px solid var(--line);border-radius:26px;
  -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:var(--shadow)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:20px;
  color:var(--muted);font-size:11px;font-weight:600;transition:background .2s,color .2s}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}

/* ============================================================
   4. 掃描頁
============================================================ */
#view-scan{background:#000;color:#fff}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#video.mirror{transform:scaleX(-1)}
#hit{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mask{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;overflow:hidden}
.finder{position:relative;width:min(70vmin,330px);aspect-ratio:1;border-radius:30px;transform:translateY(-7vh);
  box-shadow:0 0 0 100vmax rgba(0,0,0,.52);transition:transform .3s}
.finder .c{position:absolute;width:40px;height:40px;border:4px solid #fff;opacity:.95}
.finder .tl{left:-2px;top:-2px;border-right:0;border-bottom:0;border-top-left-radius:30px}
.finder .tr{right:-2px;top:-2px;border-left:0;border-bottom:0;border-top-right-radius:30px}
.finder .bl{left:-2px;bottom:-2px;border-right:0;border-top:0;border-bottom-left-radius:30px}
.finder .br{right:-2px;bottom:-2px;border-left:0;border-top:0;border-bottom-right-radius:30px}
.finder .line{position:absolute;left:12%;right:12%;top:8%;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 16px var(--accent);
  animation:sweep 2.4s ease-in-out infinite alternate}
@keyframes sweep{to{top:92%}}
.scanning-off .finder .line{animation:none;opacity:0}
@media (prefers-reduced-motion:reduce){.finder .line{animation:none;top:50%}.view.active{animation:none}}

.status{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 16px);
  padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;
  background:rgba(20,22,28,.6);border:1px solid rgba(255,255,255,.12);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.controls{position:absolute;left:0;right:0;bottom:calc(var(--tab-h) + var(--safe-b) + 34px);
  display:flex;flex-direction:column;align-items:center;gap:16px}
.ctl-row{display:flex;gap:18px}
.fab{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:rgba(30,33,42,.62);border:1px solid rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:transform .15s,background .2s}
.fab:active{transform:scale(.92)}
.fab.on{background:var(--accent);border-color:transparent}
.zoom{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;width:min(280px,76vw);
  background:rgba(30,33,42,.55);border:1px solid rgba(255,255,255,.12);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.zoom input{flex:1;accent-color:var(--accent);height:24px}
.zoom span{font-size:12px;font-variant-numeric:tabular-nums;min-width:34px;text-align:right;font-weight:600}

.cam-card{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:rgba(6,8,12,.86);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:5;text-align:center}
.cam-card .inner{max-width:340px;display:flex;flex-direction:column;align-items:center;gap:14px}
.cam-card .badge{width:84px;height:84px;border-radius:26px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.cam-card h2{margin:6px 0 0;font-size:22px}
.cam-card p{margin:0;color:#aab1c0;font-size:14px;line-height:1.6}

/* ============================================================
   5. 通用元件：按鈕、卡片、開關
============================================================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;
  border-radius:16px;font-weight:650;font-size:15px;background:var(--surface-2);color:var(--text);
  transition:transform .12s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.group-label{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:22px 8px 8px;text-transform:uppercase}
.row{display:flex;align-items:center;gap:14px;min-height:56px;padding:10px 16px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.row .ri{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-size:15px;font-weight:600}
.row .rt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.4}
.row .chev{color:var(--muted)}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--surface-3);transition:background .2s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:25px;height:25px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(20px)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.2)}

/* ============================================================
   6. 歷史紀錄
============================================================ */
.search{display:flex;align-items:center;gap:10px;padding:0 14px;height:46px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:15px;min-width:0}
.chips{display:flex;gap:8px;margin:12px 0 14px;align-items:center}
.chip{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chips .grow{flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.hist-item .ri.t-url{background:rgba(76,141,255,.16);color:#4C8DFF}
.hist-item .star{color:var(--warn)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:56px 24px;text-align:center;color:var(--muted)}
.empty .badge{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.empty b{color:var(--text);font-size:17px}
.empty span{font-size:14px;line-height:1.6}

/* ============================================================
   7. 底部彈出面板（結果 / 對話框）
============================================================ */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:51;width:min(560px,100%);max-height:88dvh;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;
  transform:translate(-50%,105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);box-shadow:var(--shadow);
  padding-bottom:calc(var(--safe-b) + 16px)}
.sheet.open{transform:translate(-50%,0)}
.sheet .grab{padding:10px 0 6px;display:grid;place-items:center;touch-action:none;cursor:grab}
.sheet .grab i{width:40px;height:5px;border-radius:3px;background:var(--surface-3)}
.sheet .body{overflow-y:auto;padding:6px 20px 8px;display:flex;flex-direction:column;gap:14px}
.res-head{display:flex;align-items:center;gap:14px}
.res-head .ri{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.res-head b{display:block;font-size:19px}
.res-head small{color:var(--muted);font-size:13px}
.content-box{background:var(--surface-2);border-radius:16px;padding:14px 16px;font-family:var(--mono);font-size:14px;line-height:1.55;
  word-break:break-all;white-space:pre-wrap;max-height:160px;overflow:auto;user-select:text;-webkit-user-select:text}
.fields{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.field{display:flex;gap:12px;padding:11px 14px;font-size:14px;align-items:center}
.field+.field{border-top:1px solid var(--line)}
.field span{color:var(--muted);flex:none;min-width:64px}
.field b{font-weight:600;word-break:break-all;flex:1;user-select:text;-webkit-user-select:text}
.field button{color:var(--accent);font-size:13px;font-weight:600}
.warn{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-size:13.5px;line-height:1.5}
.actions{display:flex;flex-direction:column;gap:10px}
.mini-row{display:flex;gap:10px}
.mini-row .btn{flex:1;min-height:46px;padding:0 8px;font-size:14px}
.dialog{position:fixed;left:50%;top:50%;z-index:61;width:min(340px,calc(100% - 40px));padding:22px;border-radius:24px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  transform:translate(-50%,-46%) scale(.95);opacity:0;pointer-events:none;transition:.2s}
.dialog.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.dialog h3{margin:0 0 8px;font-size:18px}
.dialog p{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.6}
.dialog .mini-row{margin-top:4px}

/* 安裝教學內容 */
.steps{margin:0 0 14px;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.55}
.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;margin-top:1px}
.steps .ic{display:inline-block;vertical-align:-5px;margin:0 2px;color:var(--accent)}

/* ============================================================
   8. Toast 與更新橫幅
============================================================ */
#toasts{position:fixed;left:0;right:0;z-index:80;top:calc(var(--safe-t) + 14px);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.toast{pointer-events:auto;max-width:min(420px,calc(100% - 28px));display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;
  background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);font-size:14px;font-weight:550;color:var(--text);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);animation:tin .3s cubic-bezier(.2,.9,.25,1)}
.toast.out{opacity:0;transform:translateY(-8px);transition:.25s}
.toast button{color:var(--accent);font-weight:700;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.96)}}
#update{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + var(--safe-b) + 28px);z-index:70;
  display:flex;align-items:center;gap:12px;padding:12px 14px 12px 18px;border-radius:18px;background:var(--accent);color:#fff;
  font-size:14px;font-weight:650;box-shadow:var(--shadow);max-width:calc(100% - 28px);animation:tin .35s}
#update button{background:rgba(255,255,255,.22);padding:8px 14px;border-radius:12px;font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (min-width:900px){
  .finder{width:340px}
  #tabbar{width:380px}
}
</style>
</head>
<body>

  SVG 圖示庫（Lucide 風格：24×24、線寬 1.8、圓角端點）
============================================================ -->

  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><path d="M12 20h.01"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>

<script>
'use strict';
/* ============================================================
   Scanly 主程式
   區段：0 工具 → 1 設定 → 2 UI 元件 → 3 內容解析 → 4 歷史紀錄
        → 5 結果面板 → 6 相機與解碼 → 7 分頁導覽 → 8 設定頁
        → 9 PWA（Service Worker、安裝、更新）→ 10 啟動
============================================================ */
const APP_VERSION = '1.0.1';            // 顯示用版本；快取版本請看 sw.js 的 VERSION
const NS = 'http://www.w3.org/2000/svg';
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ---------- 0. 工具函式 ---------- */
// 安全的 localStorage（隱私模式或被封鎖時不會丟例外）
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k)    { try { localStorage.removeItem(k); } catch (e) {} }
};

// 以 DOM API 建立元素（一律用 textContent，避免 XSS）
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
function icon(name, cls = '') {
  const s = document.createElementNS(NS, 'svg'); s.setAttribute('class', 'ic ' + cls); s.setAttribute('aria-hidden', 'true');
  const u = document.createElementNS(NS, 'use'); u.setAttribute('href', '#i-' + name); s.append(u); return s;
}
function setIcon(svg, name) { svg.querySelector('use').setAttribute('href', '#i-' + name); }

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
    throw new Error('no clipboard');
  } catch (e) {
    try { // 舊瀏覽器備援
      const ta = h('textarea', { style: 'position:fixed;opacity:0;top:0' }); ta.value = text;
      document.body.append(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e2) { return false; }
  }
}
function fmtTime(ts) {
  const d = new Date(ts), diff = Date.now() - ts, m = Math.floor(diff / 60000);
  if (m < 1) return '剛剛';
  if (m < 60) return m + ' 分鐘前';
  if (m < 60 * 24 && new Date().toDateString() === d.toDateString()) return Math.floor(m / 60) + ' 小時前';
  const y = new Date(Date.now() - 864e5);
  const hm = d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
  if (y.toDateString() === d.toDateString()) return '昨天 ' + hm;
  return d.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' }) + ' ' + hm;
}
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob), a = h('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}

// 全域錯誤攔截：避免白屏，並給使用者友善提示
window.addEventListener('error', e => { console.error(e.error || e.message); });
window.addEventListener('unhandledrejection', e => { console.error(e.reason); });

/* ---------- 1. 設定 ---------- */
const DEFAULTS = { theme: 'auto', sound: true, vibrate: true, continuous: false, saveHistory: true };
let settings = Object.assign({}, DEFAULTS, store.get('scanly.settings', {}));
function saveSettings() { store.set('scanly.settings', settings); }
function applyTheme() {
  const r = document.documentElement;
  if (settings.theme === 'auto') r.removeAttribute('data-theme'); else r.dataset.theme = settings.theme;
  updateThemeColor();
}
function effectiveDark() {
  return settings.theme === 'dark' || (settings.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
}
function updateThemeColor() {
  // 掃描頁固定深色；其他頁依主題
  const dark = currentTab === 'scan' || effectiveDark();
  const m = $('meta[name="theme-color"]'); if (m) m.content = currentTab === 'scan' ? '#000000' : (dark ? '#0A0C10' : '#F3F5F9');
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', updateThemeColor);

/* ---------- 2. UI 元件：Toast / 對話框 / 面板 ---------- */
function toast(msg, { action, onAction, duration = 2600 } = {}) {
  const t = h('div', { class: 'toast', role: 'status' }, h('span', { text: msg }));
  if (action) t.append(h('button', { text: action, onclick: () => { onAction && onAction(); close(); } }));
  $('#toasts').append(t);
  const close = () => { t.classList.add('out'); setTimeout(() => t.remove(), 260); };
  setTimeout(close, duration);
}

function confirmDialog({ title, msg, ok = '確定', danger = false }) {
  return new Promise(res => {
    const d = $('#dialog'), bd = $('#backdrop');
    const done = v => { d.classList.remove('open'); if (!sheetOpen) bd.classList.remove('open'); res(v); };
    d.replaceChildren(h('h3', { text: title }), h('p', { text: msg }),
      h('div', { class: 'mini-row' },
        h('button', { class: 'btn', text: '取消', onclick: () => done(false) }),
        h('button', { class: 'btn primary' + (danger ? ' danger' : ''), text: ok, onclick: () => done(true) })));
    if (danger) d.lastChild.lastChild.style.cssText = 'background:var(--danger);color:#fff';
    bd.classList.add('open'); d.classList.add('open');
    bd.onclick = () => done(false);
  });
}

let sheetOpen = false, sheetOnClose = null;
function openSheet(nodes, onClose) {
  const s = $('#sheet'); $('#sheetBody').replaceChildren(...nodes);
  sheetOnClose = onClose || null; sheetOpen = true;
  $('#backdrop').classList.add('open'); s.classList.add('open'); s.style.transform = '';
  $('#backdrop').onclick = closeSheet;
}
function closeSheet() {
  if (!sheetOpen) return; sheetOpen = false;
  $('#sheet').classList.remove('open'); $('#sheet').style.transform = '';
  $('#backdrop').classList.remove('open');
  const cb = sheetOnClose; sheetOnClose = null; cb && cb();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
// 下滑關閉面板
(() => {
  const g = $('#grab'), s = $('#sheet'); let y0 = null, dy = 0;
  g.addEventListener('pointerdown', e => { y0 = e.clientY; dy = 0; s.style.transition = 'none'; g.setPointerCapture(e.pointerId); });
  g.addEventListener('pointermove', e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); s.style.transform = `translate(-50%,${dy}px)`; });
  const end = () => { if (y0 == null) return; y0 = null; s.style.transition = ''; dy > 90 ? closeSheet() : (s.style.transform = ''); };
  g.addEventListener('pointerup', end); g.addEventListener('pointercancel', end);
})();

/* ---------- 3. 內容解析（智慧辨識類型） ---------- */
function parseWifi(s) {              // WIFI:T:WPA;S:名稱;P:密碼;H:false;;
  const out = {}; let key = '', val = '', inKey = true, esc = false;
  for (const ch of s.slice(5)) {

  return { text: r.data, fmt: 'qr_code', points: pts };
}

// 在畫面上用強調色框出偵測到的碼
let hitTimer = 0;
function drawHit(points) {
  const dpr = devicePixelRatio || 1, r = hit.getBoundingClientRect();
  hit.width = r.width * dpr; hit.height = r.height * dpr;
  const c = hit.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, r.width, r.height);
  if (!points || points.length < 3 || !video.videoWidth) return;
  const s = Math.max(r.width / video.videoWidth, r.height / video.videoHeight);
  const ox = (r.width - video.videoWidth * s) / 2, oy = (r.height - video.videoHeight * s) / 2;
  const P = points.map(([x, y]) => { let X = x * s + ox; if (cam.facing === 'user') X = r.width - X; return [X, y * s + oy]; });
  c.lineWidth = 4; c.lineJoin = 'round'; c.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#4C8DFF';
  c.shadowColor = c.strokeStyle; c.shadowBlur = 18; c.beginPath(); P.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); c.stroke();
  clearTimeout(hitTimer); hitTimer = setTimeout(() => c.clearRect(0, 0, r.width, r.height), 700);
}

// 提示音與震動
let actx = null;
function ensureAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
function feedback() {
  if (settings.vibrate && navigator.vibrate) { try { navigator.vibrate(35); } catch (e) {} }
  if (!settings.sound) return;
  try {
    ensureAudio(); if (!actx) return; const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = 'sine'; o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(1320, t + 0.08);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.18);
  } catch (e) {}
}

function handleCode(code, live) {
  const now = Date.now();
  if (live && code.text === cam.lastText && now - cam.lastAt < 2500) { cam.lastAt = now; return; }   // 同一個碼 2.5 秒內不重複觸發
  cam.lastText = code.text; cam.lastAt = now;
  feedback(); if (live) drawHit(code.points);
  const rec = addRecord(code.text, code.fmt); renderHistory();
  if (live && settings.continuous) {
    const a = analyze(rec.text, rec.fmt); toast(a.label + '：' + a.title, { action: '查看', onAction: () => showResult(rec), duration: 3200 });
    return;
  }
  if (live) { cam.paused = true; setStatus('已辨識'); }
  setTimeout(() => showResult(rec, { onClose: () => { if (cam.running) { cam.paused = false; cam.lastAt = Date.now(); setStatus('將 QR Code 對準框內'); } } }), live ? 260 : 0);
}

// 相簿 / 檔案選擇解碼
$('#btnGallery').onclick = $('#btnGallery2').onclick = () => $('#file').click();
$('#file').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    toast('解析圖片中…', { duration: 1200 });
    await initDetector();
    const bmp = await (window.createImageBitmap ? createImageBitmap(f) : new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(f); }));
    const w = bmp.width || bmp.naturalWidth, h2 = bmp.height || bmp.naturalHeight;
    let found = await decodeSource(bmp, w, h2, true);
    if (!found && window.jsQR) {        // 再試一次：放大到 1600px 並嘗試反相
      const sc = Math.min(1600 / Math.max(w, h2), 3); cvs.width = Math.round(w * sc); cvs.height = Math.round(h2 * sc); cctx.drawImage(bmp, 0, 0, cvs.width, cvs.height);
      const im = cctx.getImageData(0, 0, cvs.width, cvs.height), r = jsQR(im.data, im.width, im.height, { inversionAttempts: 'attemptBoth' });
      if (r && r.data) found = { text: r.data, fmt: 'qr_code', points: [] };
    }
    if (bmp.close) bmp.close();
    if (!found) return toast('圖片中找不到 QR Code');
    handleCode(found, false);
  } catch (err) { console.error(err); toast('無法讀取這張圖片'); }
});

/* ---------- 7. 分頁導覽 ---------- */
let currentTab = 'scan';
function switchTab(name) {
  if (!['scan', 'history', 'settings'].includes(name)) name = 'scan';
  closeSheet(); currentTab = name;
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  $$('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === name)));
  updateThemeColor();
  if (name === 'scan') { startCamera(); }   // 進入掃描頁一律自動開啟相機；失敗時 startCamera 會顯示說明與「重試」
  else { stopCamera(true); if (name === 'history') renderHistory(); }
}
$$('.tab').forEach(t => t.onclick = () => switchTab(t.dataset.tab));
// 切到背景時關閉相機（省電、保護隱私），回來時自動恢復
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (cam.running) { cam.resume = true; stopCamera(true); } }
  else if (cam.resume && currentTab === 'scan') { cam.resume = false; startCamera(); }
});

/* ---------- 8. 設定頁 ---------- */
function bindSettings() {
  $$('[data-setting]').forEach(inp => {
    inp.checked = !!settings[inp.dataset.setting];
    inp.onchange = () => { settings[inp.dataset.setting] = inp.checked; saveSettings(); if (inp.dataset.setting === 'saveHistory' && !inp.checked) toast('之後的掃描將不會被儲存'); };
  });
  const syncSeg = () => $$('#themeSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === settings.theme)));
  $$('#themeSeg button').forEach(b => b.onclick = () => { settings.theme = b.dataset.theme; saveSettings(); applyTheme(); syncSeg(); });
  syncSeg();
  $('#btnWipe').onclick = async () => {
    if (await confirmDialog({ title: '清除所有資料？', msg: '將刪除掃描紀錄與所有設定，並還原為預設值。', ok: '全部清除', danger: true })) {
      ['scanly.history', 'scanly.settings', 'scanly.camOK'].forEach(store.del); history = []; settings = Object.assign({}, DEFAULTS);
      bindSettings(); applyTheme(); renderHistory(); toast('已還原預設');
    }
  };
}

/* ---------- 9. PWA：安裝、Service Worker、更新 ---------- */
let deferredPrompt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; refreshInstallHint(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; refreshInstallHint(); toast('已安裝 Scanly'); });
function refreshInstallHint() {
  $('#installHint').textContent = isStandalone() ? '目前已在 APP 模式執行' : deferredPrompt ? '點此一鍵安裝到裝置' : '加入主畫面，像原生 App 一樣使用';
}
$('#btnInstall').onclick = () => {
  const d = $('#dialog'), bd = $('#backdrop'), close = () => { d.classList.remove('open'); if (!sheetOpen) bd.classList.remove('open'); };
  const ios = isIOS(); const kids = [h('h3', { text: '安裝 Scanly APP' })];
  if (isStandalone()) kids.push(h('p', { text: '你正在以獨立 APP 模式使用 Scanly，無需再安裝。' }));
  else {
    kids.push(h('p', { text: ios ? '在 iPhone／iPad 的 Safari 依下列步驟加入主畫面：' : deferredPrompt ? '按下方按鈕即可安裝；也可依下列步驟手動安裝。' : '依你的裝置選擇下列步驟：' }));
    const steps = ios
      ? [['點選 Safari 底部的「分享」', 'share'], ['向下捲動，選擇「加入主畫面」', 'plus-square'], ['按右上角「新增」完成']]
      : [['Android Chrome：點右上角選單', 'dots'], ['選擇「安裝應用程式」或「加到主畫面」'], ['電腦 Chrome／Edge：點網址列右側的安裝圖示']];
    kids.push(h('ol', { class: 'steps' }, steps.map(([t, i]) => h('li', {}, h('span', {}, t, i ? icon(i, 'sm') : null)))));
  }
  const btns = h('div', { class: 'actions' });
  if (deferredPrompt && !isStandalone()) btns.append(h('button', { class: 'btn primary block', onclick: async () => {
    try { deferredPrompt.prompt(); await deferredPrompt.userChoice; } catch (e) { console.warn(e); } deferredPrompt = null; close(); refreshInstallHint(); } }, icon('download', 'sm'), '立即安裝'));
  btns.append(h('a', { class: 'btn block', href: 'install.html', target: '_blank', rel: 'noopener' }, icon('external', 'sm'), '完整安裝教學與 QR Code'));
  btns.append(h('button', { class: 'btn ghost block', text: '關閉', onclick: close }));
  kids.push(btns); d.replaceChildren(...kids); bd.classList.add('open'); d.classList.add('open'); bd.onclick = close;
};

let swReg = null;
function showUpdate(worker) {
  const bar = $('#update'); bar.hidden = false;
  $('#btnDoUpdate').onclick = () => { $('#btnDoUpdate').disabled = true; worker.postMessage('SKIP_WAITING'); };   // 通知新版 SW 立即接管，controllerchange 後自動重新載入
}
function registerSW() {
  const okProto = location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname);
  if (!('serviceWorker' in navigator) || !okProto) return;
  const hadController = !!navigator.serviceWorker.controller; let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadController || reloading) return; reloading = true; location.reload(); });
  navigator.serviceWorker.register('./sw.js').then(reg => {
    swReg = reg;
    if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing; if (!nw) return;
      nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdate(nw); });
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
  }).catch(e => console.warn('Service Worker 註冊失敗', e));
}
$('#btnUpdate').onclick = async () => {
  if (!swReg) return toast('目前環境不支援離線更新（需 HTTPS）');
  try { toast('檢查更新中…', { duration: 1200 }); await swReg.update(); setTimeout(() => { if ($('#update').hidden) toast('已是最新版本'); }, 1400); }
  catch (e) { toast('檢查失敗，請確認網路連線'); }
};

/* ---------- 10. 啟動 ---------- */
(function init() {
  try {
    applyTheme(); bindSettings(); renderHistory(); refreshInstallHint(); registerSW();
    $('#verText').textContent = '版本 ' + APP_VERSION;
    const tab = new URLSearchParams(location.search).get('tab');         // 支援 manifest 捷徑 ?tab=history
    switchTab(tab || 'scan');
  } catch (e) { console.error(e); toast('啟動時發生錯誤，請重新整理'); }
})();
</script>
